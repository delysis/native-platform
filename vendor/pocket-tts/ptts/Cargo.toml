[package]
name = "ptts"
version = "0.4.0-rc.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Phonon text-to-speech inference and serving (vendored CPU runtime)"
repository = "https://github.com/gradium-ai/xn-ptts"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]
xn = "=0.2.11"
ebur128 = "=0.1.10"
rand = { version = "0.9.4", default-features = false, features = ["std_rng"] }
rand_distr = "=0.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "=0.1.44"
half = { version = "=2.7.1", optional = true }
rubato = { version = "=0.15.0", optional = true }
symphonia = { version = "=0.5.5", features = ["all"], optional = true }
safetensors = "=0.7.0"
thiserror = "2.0.18"
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"], optional = true }
hf-hub = { version = "=1.0.0", features = ["blocking"], optional = true }

[features]
default = []
hf = ["dep:tokenizers"]
hub = ["dep:hf-hub"]
audio = ["dep:symphonia", "dep:rubato"]
cuda = ["xn/cuda", "dep:half"]
vulkan = ["xn/vulkan"]
metal = ["xn/metal", "dep:half"]
webgpu = ["xn/webgpu"]
accelerate = ["xn/accelerate"]
kai = ["xn/kai"]
native-parity = ["hf"]
