# Cargo canonicalizes Git repository URLs by removing a trailing `.git` before
# patch lookup. One table per service therefore rebinds both URL spellings.
# Outer patches cover the root graph; leaf CLIs/plugins remain owned and locked
# by their preserved nested workspaces until an outer consumer needs them.
[patch."https://github.com/delysis/attachment-native-kit"]
attachment-native-document = { path = "crates/services/attachment/crates/attachment-native-document" }
attachment-native-host = { path = "crates/services/attachment/crates/attachment-native-host" }
attachment-native-inspect = { path = "crates/services/attachment/crates/attachment-native-inspect" }
