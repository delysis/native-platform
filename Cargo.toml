[workspace]
members = [
    "crates/native/crates/command-evidence",
    "crates/native/crates/llama-native-cache",
    "crates/native/crates/llama-native-engine",
    "crates/native/crates/llama-native-host",
    "crates/native/crates/llama-native-types",
    "products/fte/crates/fte-backend-llama",
    "products/fte/crates/fte-loopback",
    "products/fte/crates/fte-protocols",
    "products/fte/crates/fte-providers",
    "products/fte/crates/fte-router",
    "products/fte/crates/fte-store",
    "products/fte/crates/fte-types",
    "products/fte/crates/tauri-plugin-free-token-energy",
    "products/fte/src-tauri",
    "products/mom/apps/mom-llama/src-tauri",
    "products/mom/crates/mom-llama-cli",
    "products/mom/crates/mom-llama-runtime",
    "tests/integration-current",
    "xtask",
]
exclude = [
    "crates/platform/contracts",
    "crates/services/attachment",
    "crates/services/information",
    "crates/services/speech",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/delysis/native-platform"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.11.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
futures = "0.3.32"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.9.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4", "serde"] }

# Exact current integration inputs. Imported sources are path-rebound; the
# remaining products stay at their accepted immutable Git revisions.
llama-cpp-2-current = { package = "llama-cpp-2", git = "https://github.com/delysis/llama-cpp-rs", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false }
llama-native-types-current = { package = "llama-native-types", path = "crates/native/crates/llama-native-types" }
llama-native-host-current = { package = "llama-native-host", path = "crates/native/crates/llama-native-host" }
command-evidence-current = { package = "command-evidence", path = "crates/native/crates/command-evidence" }
llama-native-cache = { path = "crates/native/crates/llama-native-cache" }
llama-native-engine = { path = "crates/native/crates/llama-native-engine" }
llama-native-host = { path = "crates/native/crates/llama-native-host" }
llama-native-types = { path = "crates/native/crates/llama-native-types" }
attachment-native-host = { path = "crates/services/attachment/crates/attachment-native-host" }
attachment-native-types = { path = "crates/services/attachment/crates/attachment-native-types" }
fte-backend-llama = { path = "products/fte/crates/fte-backend-llama" }
fte-router = { path = "products/fte/crates/fte-router" }
fte-store = { path = "products/fte/crates/fte-store" }
fte-types = { path = "products/fte/crates/fte-types" }
tauri-plugin-free-token-energy = { path = "products/fte/crates/tauri-plugin-free-token-energy" }
information-native-host = { path = "crates/services/information/crates/information-native-host" }
speech-native-host = { path = "crates/services/speech/crates/speech-native-host" }
fte-types-current = { package = "fte-types", path = "products/fte/crates/fte-types" }
fte-backend-llama-current = { package = "fte-backend-llama", path = "products/fte/crates/fte-backend-llama" }
fte-loopback-current = { package = "fte-loopback", path = "products/fte/crates/fte-loopback" }
fte-providers-current = { package = "fte-providers", path = "products/fte/crates/fte-providers" }
mom-llama-runtime = { path = "products/mom/crates/mom-llama-runtime" }
mom-llama-runtime-current = { package = "mom-llama-runtime", path = "products/mom/crates/mom-llama-runtime" }
attachment-native-types-current = { package = "attachment-native-types", path = "crates/services/attachment/crates/attachment-native-types" }
attachment-native-host-current = { package = "attachment-native-host", path = "crates/services/attachment/crates/attachment-native-host" }
speech-native-types-current = { package = "speech-native-types", path = "crates/services/speech/crates/speech-native-types" }
speech-native-host-current = { package = "speech-native-host", path = "crates/services/speech/crates/speech-native-host" }
speech-native-platform-current = { package = "speech-native-platform", path = "crates/services/speech/crates/speech-native-platform" }
speech-native-backend-parakeet-current = { package = "speech-native-backend-parakeet", path = "crates/services/speech/crates/speech-native-backend-parakeet" }
information-native-types-current = { package = "information-native-types", path = "crates/services/information/crates/information-native-types" }
information-native-host-current = { package = "information-native-host", path = "crates/services/information/crates/information-native-host" }
loom-types-current = { package = "loom-types", git = "https://github.com/delysis/loom-native", rev = "223110bee4be72386d79306b444517371e4a9930" }
platform-contracts-v0-current = { package = "platform-contracts-v0", path = "crates/platform/contracts/crates/platform-contracts-v0" }
platform-contract-testkit-current = { package = "platform-contract-testkit", path = "crates/platform/contracts/crates/platform-contract-testkit" }
platform-vertical-fixtures-v0-current = { package = "platform-vertical-fixtures-v0", path = "crates/platform/contracts/crates/platform-vertical-fixtures-v0" }
platform-contracts-v0 = { path = "crates/platform/contracts/crates/platform-contracts-v0" }
platform-contract-testkit = { path = "crates/platform/contracts/crates/platform-contract-testkit" }
platform-vertical-fixtures-v0 = { path = "crates/platform/contracts/crates/platform-vertical-fixtures-v0" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.metadata.native-platform.package-groups]
portable = ["command-evidence", "fte-loopback", "fte-protocols", "fte-providers", "fte-router", "fte-store", "fte-types", "llama-native-cache", "llama-native-types", "mom-llama-cli", "mom-llama-runtime"]
platform = ["fte-backend-llama", "llama-native-engine", "llama-native-host", "tauri-plugin-free-token-energy"]
product = ["free-token-energy", "mom-llama-app"]
research = []
diagnostic = ["integration-current", "xtask"]
real-hardware = []

[profile.dev.package.sha2]
opt-level = 3

