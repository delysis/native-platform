[workspace]
members = [
    "crates/native/crates/command-evidence",
    "crates/native/crates/llama-native-cache",
    "crates/native/crates/llama-native-engine",
    "crates/native/crates/llama-native-host",
    "crates/native/crates/llama-native-types",
    "tests/integration-current",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/delysis/native-platform"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
crossbeam-channel = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2"
toml = "0.9.8"

# Exact current integration inputs. Native is imported and path-rebound; the
# remaining products stay at their accepted immutable Git revisions.
llama-cpp-2-current = { package = "llama-cpp-2", git = "https://github.com/delysis/llama-cpp-rs", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false }
llama-native-types-current = { package = "llama-native-types", path = "crates/native/crates/llama-native-types" }
llama-native-host-current = { package = "llama-native-host", path = "crates/native/crates/llama-native-host" }
command-evidence-current = { package = "command-evidence", path = "crates/native/crates/command-evidence" }
fte-types-current = { package = "fte-types", git = "https://github.com/delysis/free-token-energy", rev = "67814e76659688fef61f311db588d17eddee0a66" }
fte-backend-llama-current = { package = "fte-backend-llama", git = "https://github.com/delysis/free-token-energy", rev = "67814e76659688fef61f311db588d17eddee0a66" }
fte-loopback-current = { package = "fte-loopback", git = "https://github.com/delysis/free-token-energy", rev = "67814e76659688fef61f311db588d17eddee0a66" }
fte-providers-current = { package = "fte-providers", git = "https://github.com/delysis/free-token-energy", rev = "67814e76659688fef61f311db588d17eddee0a66" }
mom-llama-runtime-current = { package = "mom-llama-runtime", git = "https://github.com/delysis/mom-llama", rev = "3cf57941af6d523378e7fa8b24f5c24c8e50363f" }
attachment-native-types-current = { package = "attachment-native-types", git = "https://github.com/delysis/attachment-native-kit", rev = "2a8d3a9a1828162a51185d207822ceb1ba6283a8" }
attachment-native-host-current = { package = "attachment-native-host", git = "https://github.com/delysis/attachment-native-kit", rev = "2a8d3a9a1828162a51185d207822ceb1ba6283a8" }
speech-native-types-current = { package = "speech-native-types", git = "https://github.com/delysis/speech-native-kit", rev = "b836318f10a7e11f433ec3ea8dfa48707adc9b06" }
speech-native-host-current = { package = "speech-native-host", git = "https://github.com/delysis/speech-native-kit", rev = "b836318f10a7e11f433ec3ea8dfa48707adc9b06" }
speech-native-platform-current = { package = "speech-native-platform", git = "https://github.com/delysis/speech-native-kit", rev = "b836318f10a7e11f433ec3ea8dfa48707adc9b06" }
speech-native-backend-parakeet-current = { package = "speech-native-backend-parakeet", git = "https://github.com/delysis/speech-native-kit", rev = "b836318f10a7e11f433ec3ea8dfa48707adc9b06" }
information-native-types-current = { package = "information-native-types", git = "https://github.com/delysis/information-native-kit", rev = "7cb255a6f8dda1db7d8e7242f3aa256be06e1bfe" }
information-native-host-current = { package = "information-native-host", git = "https://github.com/delysis/information-native-kit", rev = "7cb255a6f8dda1db7d8e7242f3aa256be06e1bfe" }
loom-types-current = { package = "loom-types", git = "https://github.com/delysis/loom-native", rev = "223110bee4be72386d79306b444517371e4a9930" }
platform-contracts-v0-current = { package = "platform-contracts-v0", git = "https://github.com/delysis/w1-platform-contracts", rev = "3ed1f3235edb6d481c324f05fe83b2379e3431e6" }
platform-contract-testkit-current = { package = "platform-contract-testkit", git = "https://github.com/delysis/w1-platform-contracts", rev = "3ed1f3235edb6d481c324f05fe83b2379e3431e6" }
platform-vertical-fixtures-v0-current = { package = "platform-vertical-fixtures-v0", git = "https://github.com/delysis/w1-platform-contracts", rev = "3ed1f3235edb6d481c324f05fe83b2379e3431e6" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.metadata.native-platform.package-groups]
portable = ["command-evidence", "llama-native-cache", "llama-native-types"]
platform = ["llama-native-engine", "llama-native-host"]
product = []
research = []
diagnostic = ["integration-current", "xtask"]
real-hardware = []

[patch."https://github.com/delysis/llama-native-kit"]
command-evidence = { path = "crates/native/crates/command-evidence" }
llama-native-cache = { path = "crates/native/crates/llama-native-cache" }
llama-native-engine = { path = "crates/native/crates/llama-native-engine" }
llama-native-host = { path = "crates/native/crates/llama-native-host" }
llama-native-types = { path = "crates/native/crates/llama-native-types" }

[patch."https://github.com/delysis/llama-native-kit.git"]
command-evidence = { path = "crates/native/crates/command-evidence" }
llama-native-cache = { path = "crates/native/crates/llama-native-cache" }
llama-native-engine = { path = "crates/native/crates/llama-native-engine" }
llama-native-host = { path = "crates/native/crates/llama-native-host" }
llama-native-types = { path = "crates/native/crates/llama-native-types" }
