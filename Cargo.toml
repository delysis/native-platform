[patch."https://github.com/delysis/llama-native-kit.git"]
command-evidence = { path = "crates/native/crates/command-evidence" }
llama-native-cache = { path = "crates/native/crates/llama-native-cache" }
llama-native-engine = { path = "crates/native/crates/llama-native-engine" }
llama-native-host = { path = "crates/native/crates/llama-native-host" }
llama-native-types = { path = "crates/native/crates/llama-native-types" }

# Cargo canonicalizes Git repository URLs by removing a trailing `.git` before
# patch lookup. One table per service therefore rebinds both URL spellings.
# Outer patches cover the root graph; leaf CLIs/plugins remain owned and locked
# by their preserved nested workspaces until an outer consumer needs them.
[patch."https://github.com/delysis/attachment-native-kit"]
attachment-native-document = { path = "crates/services/attachment/crates/attachment-native-document" }
attachment-native-host = { path = "crates/services/attachment/crates/attachment-native-host" }
attachment-native-inspect = { path = "crates/services/attachment/crates/attachment-native-inspect" }
attachment-native-plan = { path = "crates/services/attachment/crates/attachment-native-plan" }
attachment-native-types = { path = "crates/services/attachment/crates/attachment-native-types" }

[patch."https://github.com/delysis/information-native-kit"]
information-native-acquire = { path = "crates/services/information/crates/information-native-acquire" }
information-native-backend-community = { path = "crates/services/information/crates/information-native-backend-community" }
information-native-backend-encyclopedia = { path = "crates/services/information/crates/information-native-backend-encyclopedia" }
information-native-backend-scripture = { path = "crates/services/information/crates/information-native-backend-scripture" }
information-native-backend-sqlite = { path = "crates/services/information/crates/information-native-backend-sqlite" }
information-native-catalog = { path = "crates/services/information/crates/information-native-catalog" }
information-native-host = { path = "crates/services/information/crates/information-native-host" }
information-native-retrieval = { path = "crates/services/information/crates/information-native-retrieval" }
information-native-store = { path = "crates/services/information/crates/information-native-store" }
information-native-types = { path = "crates/services/information/crates/information-native-types" }

[patch."https://github.com/delysis/speech-native-kit"]
