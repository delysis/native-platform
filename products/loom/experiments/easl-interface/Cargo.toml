[package]
name = "loom-easl-interface"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["native-app"]
native-app = []
# Compiles the same library for offscreen/component tests; cannot launch run().
review-only = []

[[bin]]
name = "loom-easl-interface"
path = "src/main.rs"
required-features = ["native-app"]

[dependencies]
easl = { git = "https://github.com/delysis/easl.git", rev = "6d7c913a5b8d6874ab56f5168d222dc95964afb9", features = ["window"] }
loom-text-session = { path = "../../crates/loom-text-session" }
loom-markdown = { path = "../../crates/loom-markdown" }
loom-config.workspace = true
loom-types = { path = "../../crates/loom-types" }
easl-native-text = { git = "https://github.com/delysis/easl.git", rev = "6d7c913a5b8d6874ab56f5168d222dc95964afb9" }
easl-text = { git = "https://github.com/delysis/easl.git", rev = "6d7c913a5b8d6874ab56f5168d222dc95964afb9" }
softbuffer = "0.4.8"
winit = "0.30"
accesskit = "=0.24.1"
accesskit_winit = "=0.32.2"
arboard = { version = "3.6", default-features = false }
rfd = "0.15.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wry = "=0.55.1"

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
loom-store = { path = "../../crates/loom-store" }
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
