[workspace]
resolver = "2"
members = [
    "crates/loom-types",
    "crates/loom-research-types",
    "crates/loom-inference",
    "crates/loom-eval",
    "crates/loom-eval-codex",
    "crates/loom-trial",
    "crates/loom-campaign",
    "crates/loom-benchmark",
    "crates/loom-learning",
    "crates/loom-document",
    "crates/loom-store",
    "crates/loom-context",
    "crates/loom-search",
    "crates/loom-host",
    "crates/loom-backend-llama",
    "crates/loom-cli",
    "crates/tauri-plugin-loom",
    "apps/loom/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Delysis"]
repository = "https://github.com/delysis/loom-native"

[workspace.dependencies]
atomic-write-file = "0.3.0"
clap = { version = "4.6.6", features = ["derive"] }
fs4 = "1.1.0"
getrandom = "0.3.4"
hex = "0.4.3"
jsonschema = { version = "0.49.8", default-features = false }
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
rand_chacha = "0.9.0"
rand_core = "0.9.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
safetensors = "0.8.0"
sha2 = "0.10.9"
similar = "3.1.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "sync"] }
toml = "0.9.12"
ulid = { version = "1.2.1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Exact real-model tests hash multi-gigabyte artifacts before admission. Keep
# the cryptographic primitive optimized without optimizing the whole test graph.
[profile.test.package.sha2]
opt-level = 3
