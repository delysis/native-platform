name: W1 contract tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  loom-contract:
    name: Loom contract adapter (Rust 1.92)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1

      - name: Check immutable contract pin
        run: ./scripts/check-w1-contract-pin.sh

      - name: Test Loom contract adapter
        run: cargo test --locked -p loom-host --features unstable-w1-contract-tests w1_contract_adapter

      - name: Lint Loom contract adapter
        run: cargo clippy --locked -p loom-host --features unstable-w1-contract-tests --all-targets -- -D warnings
