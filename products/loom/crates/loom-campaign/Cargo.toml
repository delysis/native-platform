[package]
name = "loom-campaign"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded, event-sourced exploratory scheduling for Loom research"

[dependencies]
loom-eval = { path = "../loom-eval" }
loom-research-types = { path = "../loom-research-types" }
loom-search = { path = "../loom-search" }
loom-store = { path = "../loom-store" }
loom-trial = { path = "../loom-trial" }
loom-types = { path = "../loom-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
