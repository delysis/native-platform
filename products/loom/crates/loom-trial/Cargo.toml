[package]
name = "loom-trial"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Frozen, replayable single-treatment trial kernel for Loom research"

[features]
default = []
real-native-tests = ["loom-inference/native-llama"]

[dependencies]
loom-inference = { path = "../loom-inference" }
loom-research-types = { path = "../loom-research-types" }
loom-store = { path = "../loom-store" }
loom-types = { path = "../loom-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
llama-native-engine.workspace = true
llama-native-types.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
