[package]
name = "loom-backend-llama"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Direct in-process llama.cpp adapter for Loom"

[features]
default = []
unstable-w1-vertical-tests = [
    "dep:platform-contracts-v0-vertical",
    "dep:platform-vertical-fixtures-v0",
]

[dependencies]
crossbeam-channel = "0.5.15"
fs4.workspace = true
hex.workspace = true
llama-native-engine.workspace = true
llama-native-host.workspace = true
llama-native-types.workspace = true
loom-types = { path = "../loom-types" }
platform-contracts-v0-vertical = { workspace = true, optional = true }
platform-vertical-fixtures-v0 = { workspace = true, optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
