[package]
name = "loom-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
unstable-w1-vertical-tests = ["dep:platform-vertical-fixtures-v0"]

[dependencies]
atomic-write-file.workspace = true
fs4.workspace = true
getrandom.workspace = true
loom-document = { path = "../loom-document" }
loom-benchmark = { path = "../loom-benchmark" }
loom-eval = { path = "../loom-eval" }
loom-inference = { path = "../loom-inference", features = ["native-evidence"] }
loom-host = { path = "../loom-host" }
loom-research-types = { path = "../loom-research-types" }
loom-types = { path = "../loom-types" }
platform-vertical-fixtures-v0 = { git = "https://github.com/delysis/w1-platform-contracts.git", rev = "fc24ffff08c52690390b4460f44617d5d9732563", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
loom-host = { path = "../loom-host", features = ["test-fixtures"] }
loom-inference = { path = "../loom-inference", features = ["test-support"] }
loom-search = { path = "../loom-search" }
tempfile.workspace = true

[lints]
workspace = true
