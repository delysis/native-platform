[package]
name = "tauri-plugin-loom"
links = "tauri-plugin-loom"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
http.workspace = true
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
loom-document = { path = "../loom-document" }
loom-backend-llama = { path = "../loom-backend-llama" }
loom-host = { path = "../loom-host", features = ["tauri-native-focus"] }
loom-store = { path = "../loom-store" }
loom-types = { path = "../loom-types" }
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.11.5", default-features = false }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }

[dev-dependencies]
loom-host = { path = "../loom-host", features = ["test-fixtures"] }
tauri = { version = "2.11.5", default-features = false, features = ["test"] }
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
