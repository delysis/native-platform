"$schema" = "schemas/schema.json"

[[set]]
identifier = "peer-compute"
description = "Review device-specific idle model grants and explicitly prepare, submit, check, or cancel exact peer jobs. Grants bind the verified model and current cabal membership. This does not grant manuscript or local-tool authority."
permissions = [
  "allow-compute-host-snapshot", "allow-compute-grant", "allow-compute-revoke",
  "allow-compute-peer-offers", "allow-compute-job-prepare", "allow-compute-job-get",
  "allow-compute-jobs", "allow-compute-job-submit", "allow-compute-job-check", "allow-compute-job-cancel", "allow-terminal-recover", "allow-terminal-run-peer",
]

[[set]]
identifier = "local-generation"
description = "Load a local model and create, cancel, or retain private generation branches. This cannot promote model text into the active manuscript."
permissions = [
  "allow-model-load",
  "allow-audio-synthesize",
  "allow-model-load-catalog-candidate",
  "allow-model-load-policy-candidate",
  "allow-model-unload",
  "allow-weave-start",
  "allow-terminal-run",
  "allow-terminal-list",
  "allow-terminal-cancel",
  "allow-generation-cancel",
  "allow-candidate-keep",
  "allow-suggestions-set",
  "allow-focus-mode-set",
]

[[set]]
identifier = "manuscript-promotion"
description = "Promote an explicitly selected private candidate into the active manuscript through Loom's source-bound store command."
permissions = [
  "allow-candidate-promote",
]

[[set]]
identifier = "verified-model-download"
description = "Download an explicitly requested GGUF over HTTPS into Loom's private model library. Every request requires an expected SHA-256 digest and a hard byte ceiling."
permissions = [
  "allow-model-download-start",
  "allow-model-download-cancel",
]

[[set]]
identifier = "microphone-capture"
description = "Start, stop, or cancel a user-requested local microphone recording and its local speech-recognition request."
permissions = [
  "allow-speech-input-record-start",
  "allow-audio-record-start",
  "allow-audio-record-stop",
  "allow-speech-input-record-stop",
  "allow-speech-input-record-cancel",
  "allow-speech-input-cancel",
]
