[package]
name = "loom-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Evidence-bound fiction evaluation and confirmatory statistics for Loom"

[features]
default = []
local-critic = ["dep:loom-inference"]

[dependencies]
loom-inference = { path = "../loom-inference", features = ["native-llama"], optional = true }
loom-research-types = { path = "../loom-research-types" }
loom-search = { path = "../loom-search" }
loom-types = { path = "../loom-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ulid.workspace = true

[dev-dependencies]
llama-native-engine = { git = "https://github.com/delysis/llama-native-kit.git", rev = "f7a69316c64d857b99bd847dd44cd852fc5b4ca4" }
llama-native-types = { git = "https://github.com/delysis/llama-native-kit.git", rev = "f7a69316c64d857b99bd847dd44cd852fc5b4ca4" }

[lints]
workspace = true
