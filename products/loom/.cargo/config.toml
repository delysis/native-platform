[net]
git-fetch-with-cli = true

[env]
# Imported Native requires macOS 13. Keep Rust, Clang, and cached CMake
# dependency builds on the same explicit floor from every Loom working directory.
MACOSX_DEPLOYMENT_TARGET = { value = "13.0", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = { value = "13.0", force = true }
