[package]
name = "free-token-energy"
version.workspace = true
description = "Local-first gateway for routing across free-tier AI providers"
authors = ["Free Token Energy contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "free_token_energy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
futures = "0.3.32"
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
axum = { version = "0.8.9", optional = true }
async-trait = "0.1.89"
anyhow = "1.0.102"
async-stream = "0.3.6"
bytes = "1.11.1"
fte-types = { path = "../crates/fte-types" }
fte-router = { path = "../crates/fte-router" }
fte-store = { path = "../crates/fte-store" }
fte-providers = { path = "../crates/fte-providers" }
fte-speech-gateway = { path = "../crates/fte-speech-gateway" }
fte-speech-platform = { path = "../crates/fte-speech-platform" }
fte-speech-parakeet = { path = "../crates/fte-speech-parakeet" }
fte-speech-types = { path = "../crates/fte-speech-types" }
tauri-plugin-free-token-energy = { path = "../crates/tauri-plugin-free-token-energy" }

[features]
default = ["axum"]
axum = ["dep:axum"]
