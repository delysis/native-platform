[package]
name = "free-token-energy"
version.workspace = true
description = "Local-first gateway for routing across free-tier AI providers"
authors = ["Free Token Energy contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "free_token_energy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Test-only adapter for the immutable Wave 1 vertical fixture protocol.
unstable-w1-vertical-tests = ["dep:platform-vertical-fixtures-v0"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.1", features = ["full"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
keyring = "4.1.6"
anyhow = "1.0.102"
fte-types = { path = "../crates/fte-types" }
fte-protocols = { path = "../crates/fte-protocols" }
fte-router = { path = "../crates/fte-router" }
fte-store = { path = "../crates/fte-store" }
fte-providers = { path = "../crates/fte-providers" }
fte-backend-llama = { path = "../crates/fte-backend-llama" }
llama-native-host.workspace = true
llama-native-types.workspace = true
tauri-plugin-free-token-energy = { path = "../crates/tauri-plugin-free-token-energy", features = ["native-llama"] }
platform-vertical-fixtures-v0 = { git = "https://github.com/delysis/w1-platform-contracts", rev = "fc24ffff08c52690390b4460f44617d5d9732563", optional = true }

[dev-dependencies]
async-trait = "0.1.92"
