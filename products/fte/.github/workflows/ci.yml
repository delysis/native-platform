name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: ./scripts/check-workflow-policy.sh
      - run: ./tests/workflow_policy.sh
      - run: ./scripts/check-native-pins.sh
      - run: ./scripts/check-w1-contract-pin.sh
      - run: ./tests/w1_contract_pin_policy.sh

  portable:
    name: Portable core (${{ matrix.os }})
    needs: workflow-policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable long Cargo git dependency paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Test portable crates
        run: >-
          cargo test --locked
          -p fte-types
          -p fte-protocols
          -p fte-router
          -p fte-providers
          -p fte-store
          -p fte-backend-llama
          -p fte-loopback
          --all-targets
      - name: Lint portable crates
        run: >-
          cargo clippy --locked
          -p fte-types
          -p fte-protocols
          -p fte-router
          -p fte-providers
          -p fte-store
          -p fte-backend-llama
          -p fte-loopback
          --all-targets -- -D warnings
      - name: Check module boundaries
        if: runner.os != 'Windows'
        run: ./scripts/check-module-boundaries.sh

  tauri-linux:
    name: Tauri shell (Linux)
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libappindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            patchelf \
            pkg-config
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm test
      - run: npm run build
      - run: cargo test --locked -p tauri-plugin-free-token-energy -p free-token-energy --all-features --all-targets
      - run: cargo clippy --locked -p tauri-plugin-free-token-energy -p free-token-energy --all-features --all-targets -- -D warnings
