name: Wave 1 contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-adapter:
    name: FTE contract adapter (Rust 1.92)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libappindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            patchelf \
            pkg-config
      - run: ./scripts/check-w1-contract-pin.sh
      - run: ./tests/w1_contract_pin_policy.sh
      - run: cargo fmt --all --check
      - name: Test real Gateway and exact contract adapter
        run: >-
          cargo test --locked -p fte-router
          --features unstable-w1-contract-tests --all-targets
      - name: Lint contract adapter
        run: >-
          cargo clippy --locked -p fte-router
          --features unstable-w1-contract-tests --all-targets -- -D warnings
      - name: Test authenticated FTE vertical fixtures
        run: >-
          cargo test --locked
          -p fte-providers --features unstable-w1-vertical-tests
          -p fte-loopback --features unstable-w1-vertical-tests
          --all-targets
      - name: Lint authenticated FTE vertical fixtures
        run: >-
          cargo clippy --locked
          -p fte-providers --features unstable-w1-vertical-tests
          -p fte-loopback --features unstable-w1-vertical-tests
          --all-targets -- -D warnings
      - name: Test explicit legacy-database rejection
        run: >-
          cargo test --locked -p free-token-energy
          --features unstable-w1-vertical-tests --lib
          db::w1_tests::w1_legacy_database_is_explicitly_unsupported
      - name: Test product-owner quit and relaunch
        run: >-
          cargo test --locked -p free-token-energy
          --features unstable-w1-vertical-tests --lib
          gateway_runtime::w1_quit_relaunch_tests::w1_product_owner_quit_relaunch_is_quiescent_and_fresh
          -- --exact
      - name: Lint explicit legacy-database rejection
        run: >-
          cargo clippy --locked -p free-token-energy
          --features unstable-w1-vertical-tests --all-targets -- -D warnings
