name: Wave 1 contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-adapter:
    name: FTE contract adapter (Rust 1.92)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: ./scripts/check-w1-contract-pin.sh
      - run: ./tests/w1_contract_pin_policy.sh
      - run: cargo fmt --all --check
      - name: Test real Gateway and exact contract adapter
        run: >-
          cargo test --locked -p fte-router
          --features unstable-w1-contract-tests --all-targets
      - name: Lint contract adapter
        run: >-
          cargo clippy --locked -p fte-router
          --features unstable-w1-contract-tests --all-targets -- -D warnings
