<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blessenger</title>
  <link rel="icon" href="./favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./composer-key-policy.js" defer></script>
  <script src="./voice-capture-policy.js" defer></script>
  <script src="./voice-pipeline-scheduler.js" defer></script>
  <script src="./coop-hx.js" defer></script>
</head>
<body>
  <main id="app" data-runtime="tauri-maud-htmx" data-native-core-only="true">
    <header class="chrome boot-chrome" aria-label="Window toolbar"></header>
    <section class="boot">
      <div id="startup-card" class="startup-card">
      <h1 id="startup-greeting" hidden>Hi Jan — I’m getting Blessenger ready.</h1>
      <div id="startup-friends" class="startup-friends" role="group" aria-label="Jan’s friends" hidden></div>
      <p id="startup-status" role="status">Opening</p>
      <progress id="startup-progress" max="100" value="0" hidden></progress>
      <button id="startup-retry" class="primary-button" type="button" hidden>Retry</button>
      <details id="startup-details" hidden>
        <summary>Details</summary>
        <pre id="startup-error"></pre>
      </details>
      </div>
    </section>
  </main>
</body>
</html>
