[package]
name = "mom-llama-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delysis/llama-native-kit"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
mom-llama-runtime = { path = "../../../crates/mom-llama-runtime" }
llama-native-types = { path = "../../../crates/llama-native-types" }
fte-backend-llama = { git = "https://github.com/delysis/free-token-energy", rev = "a63c215bb77e8d52a3eb79e87e1c4c7c1af9c71e" }
fte-router = { git = "https://github.com/delysis/free-token-energy", rev = "a63c215bb77e8d52a3eb79e87e1c4c7c1af9c71e" }
fte-store = { git = "https://github.com/delysis/free-token-energy", rev = "a63c215bb77e8d52a3eb79e87e1c4c7c1af9c71e" }
fte-types = { git = "https://github.com/delysis/free-token-energy", rev = "a63c215bb77e8d52a3eb79e87e1c4c7c1af9c71e" }
maud = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-free-token-energy = { git = "https://github.com/delysis/free-token-energy", rev = "a63c215bb77e8d52a3eb79e87e1c4c7c1af9c71e" }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "=0.16.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
