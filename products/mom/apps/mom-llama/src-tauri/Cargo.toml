[package]
name = "mom-llama-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
mom-llama-runtime.workspace = true
llama-native-types = { workspace = true }
llama-native-host = { workspace = true }
speech-native-host.workspace = true
speech-native-types.workspace = true
speech-native-platform.workspace = true
speech-native-backend-parakeet.workspace = true
maud = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
async-trait.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "=0.16.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3", "tokio"] }

[lints]
workspace = true
