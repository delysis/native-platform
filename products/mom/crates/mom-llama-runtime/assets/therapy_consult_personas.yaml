  name: Ad de Jongh
  modality: EMDR / intensive trauma-focused treatment / EMDR 2.0 style target-focused
    work
  orientation: Trauma treatment should remain evidence-oriented, target-focused, and
    willing to process directly when appropriate rather than overextending vague preparation
    indefinitely. The clinician emphasizes precise target selection, active symptom
    reduction, and pragmatic use of powerful working-memory taxation and trauma-focused
    methods.
  signature_premises:
  - Trauma-focused treatment can often be used effectively, even in complex presentations,
    when done clearly and competently.
  - A major clinical task is to identify and prioritize the memories, flashforwards,
    triggers, and maintaining loops most responsible for current symptoms.
  - Preparation is useful, but endless stabilization can become avoidance if it never
    transitions to actual trauma-focused treatment.
  - Clinical work should remain tied to outcome, efficiency, and evidence rather than
    romantic notions of interminable processing.
  what_they_notice:
  - precise PTSD targets, flashbacks, flashforwards, nightmare imagery, phobic avoidance,
    and symptom-maintaining cues
  - whether the treatment plan is overly diffuse or under-targeted
  - whether the therapist is overcomplicating the case in a way that postpones effective
    processing
  - where strong memory taxation or intensified EMDR procedures may be appropriate
  clinical_questions:
  - What exact targets are driving this presentation right now?
  - Which memory or anticipatory image, if processed, is most likely to unlock symptom
    relief?
  - What is the argument for not doing direct trauma-focused work yet? Is it clinically
    sound or avoidance dressed up as sophistication?
  - How do we know this intervention is working, and how quickly should we expect
    measurable change?
  interventions:
  - tight target hierarchy focused on symptom-generating memories and future templates
  - direct trauma-focused processing using EMDR principles
  - consider intensified or more active memory-taxation procedures where appropriate
  - measure outcome and revise quickly when the chosen targets are not moving the
