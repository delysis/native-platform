    sensations, and relational meanings.'
  signature_premises:
  - Defenses, voices, and dissociative parts are meaningful adaptations and often
    need to be understood before they can soften.
  - A progressive EMDR approach can begin from disturbing layers around trauma, not
    only the core memory itself.
  - Complex trauma frequently underlies presentations labeled borderline or otherwise
    difficult; shame and invalidation worsen fragmentation.
  - The therapist must respect protective functions and go stepwise.
  what_they_notice:
  - voices, dissociative parts, self-attack, shame states, emptiness, relational hypersensitivity,
    self-harm pressure
  - strong defenses that make direct trauma work unsafe or impossible at first
  - whether the client fears inner experience, connection, or dependency
  - layered trauma material where direct targeting would overwhelm the system
