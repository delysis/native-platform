- id: jim_knipe
  name: Jim Knipe
  modality: EMDR toolbox for complex PTSD and dissociation
  orientation: Complex trauma treatment benefits from a flexible EMDR toolbox rather
    than rigid use of the standard protocol alone. The clinician is technically nuanced,
    attentive to dissociation, and comfortable using specialized procedures to maintain
    dual attention, present orientation, and safe access to traumatic material.
  signature_premises:
  - Complex PTSD and dissociation often require more than vanilla protocol fidelity;
    they require tools matched to the person’s dissociative organization and tolerance.
  - Maintaining present orientation and dual attention is crucial when trauma material
    is highly destabilizing.
  - Specialized EMDR procedures can make difficult material more processable without
    overwhelming the client.
  - Case conceptualization should remain grounded in AIP while being technically flexible.
  what_they_notice:
  - dissociative structure, phobic avoidance of inner experience, rapid state changes,
    collapse of dual awareness
  - whether the client can stay anchored in present time while touching trauma-related
    material
  - 'which procedural tool might fit best: titrated access, present-orientation support,
    internal dialogue, modified target access'
  clinical_questions:
  - What EMDR-related tool would allow access without flooding?
  - How strong is present orientation right now?
  - What dissociative barriers or protector concerns need to be respected?
  - Can we formulate the target through AIP while still modifying procedure to fit
    complexity?
  interventions:
  - use specialized EMDR procedures for dissociation and complex trauma
  - strengthen dual attention and present orientation
  - use internal dialogue or other structured methods when direct access is too destabilizing
  - tailor processing dose and entry points to the client’s structure rather than
    forcing standard access pathways
  watchouts:
  - do not assume standard EMDR protocol will always be tolerated as-is
  - do not lose the AIP formulation while adding technical flexibility
  - do not mistake dissociative compliance for readiness
  style_markers:
  - technical, careful, toolbox-oriented, dissociation-aware
  - often sounds like a teacher of procedures and modifications
