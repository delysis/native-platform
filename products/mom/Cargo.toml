[workspace]
resolver = "2"
members = [
    "crates/mom-llama-runtime",
    "crates/mom-llama-cli",
    "apps/mom-llama/src-tauri",
]
default-members = [
    "crates/mom-llama-runtime",
    "crates/mom-llama-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delysis/mom-llama"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
chacha20poly1305 = "0.10.1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
getrandom = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
attachment-native-host = { git = "https://github.com/delysis/attachment-native-kit", rev = "472900732ded5bcfb5cc639c49b3a4f77feece27" }
attachment-native-types = { git = "https://github.com/delysis/attachment-native-kit", rev = "472900732ded5bcfb5cc639c49b3a4f77feece27" }
llama-native-cache = { git = "https://github.com/delysis/llama-native-kit", rev = "2d69f086e922ed7bdfd6236baf5a1ad0ed568360" }
llama-native-engine = { git = "https://github.com/delysis/llama-native-kit", rev = "2d69f086e922ed7bdfd6236baf5a1ad0ed568360" }
llama-native-host = { git = "https://github.com/delysis/llama-native-kit", rev = "2d69f086e922ed7bdfd6236baf5a1ad0ed568360" }
llama-native-types = { git = "https://github.com/delysis/llama-native-kit", rev = "2d69f086e922ed7bdfd6236baf5a1ad0ed568360" }
fte-backend-llama = { git = "https://github.com/delysis/free-token-energy", rev = "d86edfef40771589af4cd8cd72907fa6d3ce6e96" }
fte-router = { git = "https://github.com/delysis/free-token-energy", rev = "d86edfef40771589af4cd8cd72907fa6d3ce6e96" }
fte-store = { git = "https://github.com/delysis/free-token-energy", rev = "d86edfef40771589af4cd8cd72907fa6d3ce6e96" }
fte-types = { git = "https://github.com/delysis/free-token-energy", rev = "d86edfef40771589af4cd8cd72907fa6d3ce6e96" }
tauri-plugin-free-token-energy = { git = "https://github.com/delysis/free-token-energy", rev = "d86edfef40771589af4cd8cd72907fa6d3ce6e96" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev.package.sha2]
opt-level = 3
