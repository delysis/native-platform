[workspace]
resolver = "2"
members = [
    "crates/mom-llama-runtime",
    "crates/mom-llama-cli",
    "apps/mom-llama/src-tauri",
]
default-members = [
    "crates/mom-llama-runtime",
    "crates/mom-llama-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delysis/mom-llama"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
chacha20poly1305 = "0.10.1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
getrandom = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
llama-native-cache = { git = "https://github.com/delysis/llama-native-kit", rev = "a185a4be3c6ad6ea1935e01acef8946c7dfdc459" }
llama-native-engine = { git = "https://github.com/delysis/llama-native-kit", rev = "a185a4be3c6ad6ea1935e01acef8946c7dfdc459" }
llama-native-host = { git = "https://github.com/delysis/llama-native-kit", rev = "a185a4be3c6ad6ea1935e01acef8946c7dfdc459" }
llama-native-types = { git = "https://github.com/delysis/llama-native-kit", rev = "a185a4be3c6ad6ea1935e01acef8946c7dfdc459" }
fte-backend-llama = { git = "https://github.com/delysis/free-token-energy", rev = "40788e397e79c4c27df40cc702f07af500bb88eb" }
fte-router = { git = "https://github.com/delysis/free-token-energy", rev = "40788e397e79c4c27df40cc702f07af500bb88eb" }
fte-store = { git = "https://github.com/delysis/free-token-energy", rev = "40788e397e79c4c27df40cc702f07af500bb88eb" }
fte-types = { git = "https://github.com/delysis/free-token-energy", rev = "40788e397e79c4c27df40cc702f07af500bb88eb" }
tauri-plugin-free-token-energy = { git = "https://github.com/delysis/free-token-energy", rev = "40788e397e79c4c27df40cc702f07af500bb88eb" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev.package.sha2]
opt-level = 3
