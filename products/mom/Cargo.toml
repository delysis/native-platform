[workspace]
resolver = "2"
members = [
    "crates/mom-llama-runtime",
    "crates/mom-llama-cli",
    "apps/mom-llama/src-tauri",
]
default-members = [
    "crates/mom-llama-runtime",
    "crates/mom-llama-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delysis/mom-llama"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
chacha20poly1305 = "0.10.1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
getrandom = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
attachment-native-host = { path = "../../crates/services/attachment/crates/attachment-native-host" }
attachment-native-types = { path = "../../crates/services/attachment/crates/attachment-native-types" }
llama-native-cache = { path = "../../crates/native/crates/llama-native-cache" }
llama-native-engine = { path = "../../crates/native/crates/llama-native-engine" }
llama-native-host = { path = "../../crates/native/crates/llama-native-host" }
llama-native-types = { path = "../../crates/native/crates/llama-native-types" }
fte-backend-llama = { path = "../fte/crates/fte-backend-llama" }
fte-router = { path = "../fte/crates/fte-router" }
fte-store = { path = "../fte/crates/fte-store" }
fte-types = { path = "../fte/crates/fte-types" }
tauri-plugin-free-token-energy = { path = "../fte/crates/tauri-plugin-free-token-energy" }
platform-contracts-v0 = { path = "../../crates/platform/contracts/crates/platform-contracts-v0" }
platform-contract-testkit = { path = "../../crates/platform/contracts/crates/platform-contract-testkit" }
platform-contracts-v0-vertical = { package = "platform-contracts-v0", path = "../../crates/platform/contracts/crates/platform-contracts-v0" }
platform-vertical-fixtures-v0 = { path = "../../crates/platform/contracts/crates/platform-vertical-fixtures-v0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev.package.sha2]
opt-level = 3
