name: Wave 1 shutdown envelope

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  mom-shutdown-contract:
    name: Mom shutdown contract (Rust 1.92)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: brew install ripgrep
      - run: cargo test --locked -p mom-llama-app --features unstable-w1-contracts
      - run: cargo clippy --locked -p mom-llama-app --all-targets --features unstable-w1-contracts -- -D warnings
      - run: cargo test --locked -p mom-llama-runtime --features unstable-w1-vertical-fixtures
      - run: cargo test --locked -p mom-llama-app --features unstable-w1-vertical-fixtures
      - run: cargo clippy --locked -p mom-llama-runtime --all-targets --features unstable-w1-vertical-fixtures -- -D warnings
      - run: cargo clippy --locked -p mom-llama-app --all-targets --features unstable-w1-vertical-fixtures -- -D warnings
      - run: ./scripts/check-architecture.sh
