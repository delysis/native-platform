name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  product-runtime:
    name: Product runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Authorize immutable private dependencies
        shell: bash
        env:
          LLAMA_NATIVE_KIT_DEPLOY_KEY: ${{ secrets.LLAMA_NATIVE_KIT_DEPLOY_KEY }}
          FREE_TOKEN_ENERGY_DEPLOY_KEY: ${{ secrets.FREE_TOKEN_ENERGY_DEPLOY_KEY }}
        run: |
          test -n "$LLAMA_NATIVE_KIT_DEPLOY_KEY"
          test -n "$FREE_TOKEN_ENERGY_DEPLOY_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LLAMA_NATIVE_KIT_DEPLOY_KEY" > "$HOME/.ssh/llama_native_kit"
          printf '%s\n' "$FREE_TOKEN_ENERGY_DEPLOY_KEY" > "$HOME/.ssh/free_token_energy"
          chmod 600 "$HOME/.ssh/llama_native_kit" "$HOME/.ssh/free_token_energy"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-native-kit
            HostName github.com
            User git
            IdentityFile ~/.ssh/llama_native_kit
            IdentitiesOnly yes
          Host github-fte
            HostName github.com
            User git
            IdentityFile ~/.ssh/free_token_energy
            IdentitiesOnly yes
          EOF
          git config --global url."git@github-native-kit:delysis/llama-native-kit".insteadOf "https://github.com/delysis/llama-native-kit"
          git config --global url."git@github-fte:delysis/free-token-energy".insteadOf "https://github.com/delysis/free-token-energy"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build ripgrep

      - name: Install architecture-check tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Test product runtime and CLI
        run: cargo test --workspace --exclude mom-llama-app

      - name: Lint product runtime and CLI
        run: cargo clippy --workspace --all-targets --exclude mom-llama-app -- -D warnings

      - name: Check product boundaries and contracts
        if: runner.os != 'Windows'
        run: |
          ./scripts/check-architecture.sh
          ./scripts/check-contracts.sh

  native-app:
    name: Mom Llama app (macOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Authorize immutable private dependencies
        shell: bash
        env:
          LLAMA_NATIVE_KIT_DEPLOY_KEY: ${{ secrets.LLAMA_NATIVE_KIT_DEPLOY_KEY }}
          FREE_TOKEN_ENERGY_DEPLOY_KEY: ${{ secrets.FREE_TOKEN_ENERGY_DEPLOY_KEY }}
        run: |
          test -n "$LLAMA_NATIVE_KIT_DEPLOY_KEY"
          test -n "$FREE_TOKEN_ENERGY_DEPLOY_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LLAMA_NATIVE_KIT_DEPLOY_KEY" > "$HOME/.ssh/llama_native_kit"
          printf '%s\n' "$FREE_TOKEN_ENERGY_DEPLOY_KEY" > "$HOME/.ssh/free_token_energy"
          chmod 600 "$HOME/.ssh/llama_native_kit" "$HOME/.ssh/free_token_energy"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host github-native-kit
            HostName github.com
            User git
            IdentityFile ~/.ssh/llama_native_kit
            IdentitiesOnly yes
          Host github-fte
            HostName github.com
            User git
            IdentityFile ~/.ssh/free_token_energy
            IdentitiesOnly yes
          EOF
          git config --global url."git@github-native-kit:delysis/llama-native-kit".insteadOf "https://github.com/delysis/llama-native-kit"
          git config --global url."git@github-fte:delysis/free-token-energy".insteadOf "https://github.com/delysis/free-token-energy"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native UX probe tools
        run: brew install ripgrep

      - run: cargo test -p mom-llama-app
      - run: cargo clippy -p mom-llama-app --all-targets -- -D warnings
      - run: ./scripts/check-persona-product-ux.sh
      - run: node --check apps/mom-llama/ui/coop-hx.js
