name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/check-workflow-policy.sh
      - run: ./tests/workflow_policy.sh

  product-runtime:
    name: Product runtime (${{ matrix.os }})
    needs: workflow-policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable long Cargo dependency paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1

      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build ripgrep

      - name: Install architecture-check tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Test product runtime and CLI
        run: cargo test --workspace --exclude mom-llama-app

      - name: Lint product runtime and CLI
        run: cargo clippy --workspace --all-targets --exclude mom-llama-app -- -D warnings

      - name: Check product boundaries and contracts
        if: runner.os != 'Windows'
        run: |
          ./scripts/check-architecture.sh
          ./scripts/check-contracts.sh

  native-app:
    name: Mom Llama app (macOS)
    needs: workflow-policy
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install native UX probe tools
        run: brew install ripgrep

      - run: cargo test -p mom-llama-app
      - run: cargo clippy -p mom-llama-app --all-targets -- -D warnings
      - run: ./scripts/check-persona-product-ux.sh
      - run: node --check apps/mom-llama/ui/coop-hx.js
