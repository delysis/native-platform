[advisories]
git-fetch-with-cli = true
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Transitive paste macro dependency; no runtime vulnerability reported. Review upstream replacement by 2026-12-09." },
    { id = "RUSTSEC-2024-0370", reason = "Transitive GTK3 macro dependency; no fixed compatible version. Review with Tauri GTK3 retirement by 2026-12-09." },
    { id = "RUSTSEC-2025-0081", reason = "Tauri urlpattern uses rust-unic; maintenance notice only. Review upstream replacement by 2026-12-09." },
    { id = "RUSTSEC-2025-0075", reason = "Tauri urlpattern uses rust-unic; maintenance notice only. Review upstream replacement by 2026-12-09." },
    { id = "RUSTSEC-2025-0080", reason = "Tauri urlpattern uses rust-unic; maintenance notice only. Review upstream replacement by 2026-12-09." },
    { id = "RUSTSEC-2025-0100", reason = "Tauri urlpattern uses rust-unic; maintenance notice only. Review upstream replacement by 2026-12-09." },
    { id = "RUSTSEC-2025-0098", reason = "Tauri urlpattern uses rust-unic; maintenance notice only. Review upstream replacement by 2026-12-09." },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    "CC0-1.0", "BSL-1.0", "MPL-2.0", "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/delysis/llama-cpp-rs"]
