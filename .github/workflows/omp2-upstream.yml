name: OMP2 upstream review

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: omp2-upstream-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - name: Prepare pinned-source comparison
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch --branch omp2 https://github.com/can1357/oh-my-pi.git "$RUNNER_TEMP/omp2"
          revision=$(git -C "$RUNNER_TEMP/omp2" rev-parse HEAD)
          cargo run --locked -p xtask -- omp2 review "$RUNNER_TEMP/omp2" "$revision" "$RUNNER_TEMP/omp2-review"
          cat "$RUNNER_TEMP/omp2-review/REVIEW.txt" >> "$GITHUB_STEP_SUMMARY"
          if test -s "$RUNNER_TEMP/omp2-review/upstream.diff"; then
            echo 'Upstream changes require maintainer review; no source pin was changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No watched upstream changes at this revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain review bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omp2-upstream-review
          path: ${{ runner.temp }}/omp2-review
          retention-days: 30
          if-no-files-found: error
