name: dependencies

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/package.json'
      - pnpm-lock.yaml
      - deny.toml
      - vendor/**
      - .github/workflows/dependencies.yml
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.92.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install hash-pinned dependency scanner
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/cargo-deny.tar.gz"
          printf '%s  %s\n' 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f "$RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: cargo deny --locked check advisories licenses sources
      - run: cargo deny --manifest-path crates/services/attachment/fuzz/Cargo.toml --locked --config deny.toml check advisories licenses sources
      - name: Audit JavaScript lock
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm audit --audit-level=low
