name: ci-full-root

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  root:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - if: runner.os == 'Linux'
        run: node --test scripts/ci/test-current-docs.mjs
      - if: runner.os == 'Linux'
        run: node scripts/ci/validate-current-docs.mjs
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install desktop system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-root-${{ runner.os }}
          cache-on-failure: true
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - uses: ./.github/actions/loom-signal
      - run: cargo fmt --all -- --check
      - name: Compile macOS smoke support
        if: runner.os == 'macOS'
        run: cargo run --locked -p xtask -- macos-smoke-support target/macos-smoke-support
      - run: cargo test --locked --workspace --all-targets --no-fail-fast
      - run: cargo test --locked --workspace --doc
      - name: Reconcile ignored-test evidence registry with guarded list arguments
        run: node scripts/ci/validate-ignored-tests.mjs --cargo-list
      - name: Inspect Windows native loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/inspect-windows-linkage.ps1
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Exercise the patched GLib iterator with optimization
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p xtask --test glib_iterator
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'macOS'
        with:
          node-version: "22"
      - name: Browser interaction and desktop packaging
        if: runner.os == 'macOS'
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @delysis/loom exec playwright install webkit
          pnpm --filter @delysis/loom run test:browser
          pnpm --filter @delysis/loom exec tauri build --debug
          pnpm --filter free-token-energy exec tauri build --debug
