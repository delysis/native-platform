name: ci-pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
      root: ${{ steps.plan.outputs.root }}
      native: ${{ steps.plan.outputs.native }}
      gateway: ${{ steps.plan.outputs.gateway }}
      attachment: ${{ steps.plan.outputs.attachment }}
      information: ${{ steps.plan.outputs.information }}
      speech: ${{ steps.plan.outputs.speech }}
      mom: ${{ steps.plan.outputs.mom }}
      loom: ${{ steps.plan.outputs.loom }}
      frontend_fte: ${{ steps.plan.outputs.frontend_fte }}
      frontend_mom: ${{ steps.plan.outputs.frontend_mom }}
      frontend_loom: ${{ steps.plan.outputs.frontend_loom }}
      dependency_graph: ${{ steps.plan.outputs.dependency_graph }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      platform_macos: ${{ steps.plan.outputs.platform_macos }}
      ignored_tests: ${{ steps.plan.outputs.ignored_tests }}
      full: ${{ steps.plan.outputs.full }}
      mom_present: ${{ steps.plan.outputs.mom_present }}
      loom_present: ${{ steps.plan.outputs.loom_present }}
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      ignored_matrix: ${{ steps.plan.outputs.ignored_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/ci-plan.mjs

  policy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # Filtering test names still builds xtask's Linux GLib regression dependency.
      - name: Install policy test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: policy-linux
          save-if: false
      - run: node --test scripts/ci/test-ci-metadata-selection.mjs scripts/ci/test-ci-plan.mjs scripts/ci/test-ci-required.mjs scripts/ci/test-ignored-tests.mjs scripts/ci/test-product-state-backup.mjs scripts/ci/test-workflows.mjs
      - run: node --test scripts/ci/test-current-docs.mjs
      - run: node scripts/ci/validate-current-docs.mjs
      - run: cargo test --locked -p xtask no_python
      - run: cargo run --locked -p xtask -- policy

  root-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.root == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    name: root-linux (${{ matrix.command }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        command: [test, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: ${{ matrix.command == 'test' && 'rustfmt' || 'clippy' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - if: ${{ matrix.command == 'test' }}
        run: cargo fmt --all -- --check
      - if: ${{ matrix.command == 'test' }}
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: Reconcile Linux ignored-test inventory using the workspace build
        if: ${{ !cancelled() && matrix.command == 'test' && (needs.plan.outputs.ignored_tests == 'true' || needs.plan.outputs.full == 'true') }}
        run: node scripts/ci/validate-ignored-tests.mjs --cargo-list
      - if: ${{ matrix.command == 'clippy' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  native-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.native == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - run: ./crates/native/scripts/check-architecture.sh

  gateway-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.gateway == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - run: node scripts/ci/cargo-group.mjs test gateway
      - run: node scripts/ci/cargo-group.mjs clippy gateway

  attachment-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.attachment == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - run: node scripts/ci/cargo-group.mjs fmt service-attachment
      - run: node scripts/ci/cargo-group.mjs test service-attachment
      - run: node scripts/ci/cargo-group.mjs clippy service-attachment

  information-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.information == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - run: node scripts/ci/cargo-group.mjs fmt service-information
      - run: node scripts/ci/cargo-group.mjs test service-information
      - run: node scripts/ci/cargo-group.mjs clippy service-information

  information-windows:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.information == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - run: node scripts/ci/cargo-group.mjs test service-information

  speech-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.speech == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - run: node scripts/ci/cargo-group.mjs fmt service-speech
      - run: node scripts/ci/cargo-group.mjs test service-speech
      - run: node scripts/ci/cargo-group.mjs clippy service-speech

  mom-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.mom_present == 'true' && (needs.plan.outputs.mom == 'true' || needs.plan.outputs.full == 'true')) }}
    needs: [plan, ci-required]
    name: mom-linux (${{ matrix.command }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        command: [test, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - if: ${{ matrix.command == 'test' }}
        run: node scripts/ci/cargo-group.mjs test product-mom
      - if: ${{ matrix.command == 'clippy' }}
        run: node scripts/ci/cargo-group.mjs clippy product-mom

  mom-windows:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.mom_present == 'true' && (needs.plan.outputs.mom == 'true' || needs.plan.outputs.full == 'true')) }}
    needs: [plan, ci-required]
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ~/AppData/Local/ort.pyke.io/dfbin
      - run: node scripts/ci/cargo-group.mjs test product-mom

  loom-linux:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.loom_present == 'true' && (needs.plan.outputs.loom == 'true' || needs.plan.outputs.full == 'true')) }}
    needs: [plan, ci-required]
    name: loom-linux (${{ matrix.command }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        command: [test, clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - if: ${{ matrix.command == 'test' }}
        run: node scripts/ci/cargo-group.mjs fmt product-loom
      - if: ${{ matrix.command == 'test' }}
        run: node scripts/ci/cargo-group.mjs test product-loom
      - if: ${{ matrix.command == 'clippy' }}
        run: node scripts/ci/cargo-group.mjs clippy product-loom

  loom-windows:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.loom_present == 'true' && (needs.plan.outputs.loom == 'true' || needs.plan.outputs.full == 'true')) }}
    needs: [plan, ci-required]
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ~/AppData/Local/ort.pyke.io/dfbin
      - run: node scripts/ci/cargo-group.mjs test product-loom

      - name: Inspect Windows native loader failure
        if: failure()
        shell: pwsh
        run: ./scripts/ci/inspect-windows-linkage.ps1

  frontend:
    if: ${{ needs.plan.outputs.frontend_fte == 'true' || needs.plan.outputs.frontend_mom == 'true' || needs.plan.outputs.frontend_loom == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: FTE frontend
        if: ${{ needs.plan.outputs.frontend_fte == 'true' }}
        run: |
          pnpm --filter free-token-energy run check:frontend
          pnpm --filter free-token-energy run test:frontend
      - name: Mom frontend
        if: ${{ needs.plan.outputs.frontend_mom == 'true' }}
        run: |
          pnpm --filter @delysis/mom-llama run check:frontend
          pnpm --filter @delysis/mom-llama run test:frontend
      - name: Loom frontend
        if: ${{ needs.plan.outputs.frontend_loom == 'true' }}
        run: |
          pnpm --filter @delysis/loom run test
          pnpm --filter @delysis/loom run check
          pnpm --filter @delysis/loom run build

  platform-macos:
    if: ${{ needs.plan.outputs.platform_macos == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    name: platform-macos (${{ matrix.component }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ~/Library/Caches/ort.pyke.io/dfbin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ matrix.component == 'loom' }}
        with:
          node-version: "22"
      - if: ${{ matrix.component == 'loom' }}
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @delysis/loom exec playwright install webkit
      - name: Release tooling shell syntax
        if: ${{ matrix.component == 'release' }}
        run: sh -n scripts/release-macos.sh scripts/smoke-macos-app.sh
      - name: Compile macOS smoke support
        if: ${{ matrix.component == 'release' }}
        run: cargo run --locked -p xtask -- macos-smoke-support target/macos-smoke-support
      - name: Root platform graph
        if: ${{ matrix.component == 'root' }}
        run: cargo check --locked --workspace --all-targets
      - name: Native macOS tests, doctests, and strict Clippy
        if: ${{ matrix.component == 'native' }}
        run: |
          node scripts/ci/cargo-group.mjs test native
          cargo test --locked --doc \
            --package llama-native-cache \
            --package llama-native-engine \
            --package llama-native-host \
            --package llama-native-types
          node scripts/ci/cargo-group.mjs clippy native
      - name: Mom macOS parity
        if: ${{ matrix.component == 'mom' }}
        run: |
          node scripts/ci/cargo-group.mjs test product-mom
      - name: Attachment macOS
        if: ${{ matrix.component == 'attachment' }}
        run: node scripts/ci/cargo-group.mjs test service-attachment
      - name: Information macOS portable
        if: ${{ matrix.component == 'information' }}
        run: node scripts/ci/cargo-group.mjs test service-information
      - name: Speech macOS
        if: ${{ matrix.component == 'speech' }}
        run: node scripts/ci/cargo-group.mjs test service-speech
      - name: Loom macOS
        if: ${{ matrix.component == 'loom' }}
        run: |
          node scripts/ci/cargo-group.mjs test product-loom
          pnpm --filter @delysis/loom run test:browser
          pnpm --filter @delysis/loom exec tauri build --debug

  dependency-graph:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.dependency_graph == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - run: cargo metadata --locked --no-deps
      - run: cargo tree -d
      - run: cargo tree --locked -i libsqlite3-sys

  ignored-tests:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.ignored_tests == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    name: ignored-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.ignored_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install desktop system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
      - name: Reconcile exact ignored-test inventory with guarded list arguments
        run: node scripts/ci/validate-ignored-tests.mjs --cargo-list
      - name: Inspect Windows native loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/inspect-windows-linkage.ps1

  fuzz-build:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.fuzz == 'true' || needs.plan.outputs.full == 'true') }}
    needs: [plan, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install nightly-2026-07-26 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/services/attachment/fuzz -> target
          shared-key: attachment-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: rustup run nightly-2026-07-26 cargo install cargo-fuzz --version 0.13.2 --locked
      - run: |
          rustup run nightly-2026-07-26 cargo fuzz build --fuzz-dir crates/services/attachment/fuzz inspect
          rustup run nightly-2026-07-26 cargo fuzz build --fuzz-dir crates/services/attachment/fuzz pipeline

  ci-required:
    name: ci-required
    if: always()
    needs:
      - plan
      - policy
      - frontend
      - platform-macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-required.mjs
