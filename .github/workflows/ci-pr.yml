name: ci-pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
      root: ${{ steps.plan.outputs.root }}
      native: ${{ steps.plan.outputs.native }}
      gateway: ${{ steps.plan.outputs.gateway }}
      attachment: ${{ steps.plan.outputs.attachment }}
      information: ${{ steps.plan.outputs.information }}
      speech: ${{ steps.plan.outputs.speech }}
      mom: ${{ steps.plan.outputs.mom }}
      loom: ${{ steps.plan.outputs.loom }}
      frontend_fte: ${{ steps.plan.outputs.frontend_fte }}
      frontend_mom: ${{ steps.plan.outputs.frontend_mom }}
      frontend_loom: ${{ steps.plan.outputs.frontend_loom }}
      dependency_graph: ${{ steps.plan.outputs.dependency_graph }}
      migration_history: ${{ steps.plan.outputs.migration_history }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      platform_macos: ${{ steps.plan.outputs.platform_macos }}
      full: ${{ steps.plan.outputs.full }}
      mom_present: ${{ steps.plan.outputs.mom_present }}
      loom_present: ${{ steps.plan.outputs.loom_present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/ci-plan.mjs

  policy:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: policy-linux
      - run: node --test scripts/ci/test-ci-plan.mjs scripts/ci/test-ci-required.mjs scripts/ci/test-workflows.mjs
      - run: cargo run --locked -p xtask -- policy

  root-linux:
    if: ${{ needs.plan.outputs.root == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: root-linux
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  native-linux:
    if: ${{ needs.plan.outputs.native == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-linux
      - run: cargo test --locked -p llama-native-engine --features unstable-w1-contract-tests,unstable-w1-vertical-tests --all-targets
      - run: ./crates/native/scripts/check-architecture.sh

  gateway-linux:
    if: ${{ needs.plan.outputs.gateway == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: gateway-linux
      - run: node scripts/ci/cargo-group.mjs test gateway
      - run: node scripts/ci/cargo-group.mjs clippy gateway

  attachment-linux:
    if: ${{ needs.plan.outputs.attachment == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: attachment-linux
      - run: node scripts/ci/cargo-group.mjs fmt service-attachment
      - run: node scripts/ci/cargo-group.mjs test service-attachment
      - run: node scripts/ci/cargo-group.mjs clippy service-attachment

  information-linux:
    if: ${{ needs.plan.outputs.information == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: information-linux
      - run: node scripts/ci/cargo-group.mjs fmt service-information
      - run: node scripts/ci/cargo-group.mjs test service-information
      - run: node scripts/ci/cargo-group.mjs clippy service-information
      - run: cargo test --locked -p information-native-acquire --features unstable-w1-contracts
      - run: cargo test --locked -p information-native-host --features unstable-w1-vertical-tests --test w1_vertical

  speech-linux:
    if: ${{ needs.plan.outputs.speech == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: speech-linux
      - run: node scripts/ci/cargo-group.mjs fmt service-speech
      - run: node scripts/ci/cargo-group.mjs test service-speech
      - run: cargo test --locked -p speech-native-host --all-targets --features unstable-w1-contract-tests,unstable-w1-vertical-tests
      - run: node scripts/ci/cargo-group.mjs clippy service-speech

  mom-linux:
    if: ${{ needs.plan.outputs.mom_present == 'true' && (needs.plan.outputs.mom == 'true' || needs.plan.outputs.full == 'true') }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: mom-linux
      - run: node scripts/ci/cargo-group.mjs test product-mom
      - run: node scripts/ci/cargo-group.mjs clippy product-mom

  loom-linux:
    if: ${{ needs.plan.outputs.loom_present == 'true' && (needs.plan.outputs.loom == 'true' || needs.plan.outputs.full == 'true') }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: loom-linux
      - run: node scripts/ci/cargo-group.mjs fmt product-loom research-loom
      - run: node scripts/ci/cargo-group.mjs test product-loom research-loom
      - run: node scripts/ci/cargo-group.mjs clippy product-loom research-loom

  frontend:
    if: ${{ needs.plan.outputs.frontend_fte == 'true' || needs.plan.outputs.frontend_mom == 'true' || needs.plan.outputs.frontend_loom == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run check
      - run: pnpm -r --if-present run build

  platform-macos:
    if: ${{ needs.plan.outputs.platform_macos == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: platform-macos
      - name: Root platform graph
        if: ${{ needs.plan.outputs.root == 'true' || needs.plan.outputs.native == 'true' || needs.plan.outputs.gateway == 'true' || needs.plan.outputs.mom == 'true' || needs.plan.outputs.full == 'true' }}
        run: cargo check --locked --workspace --all-targets
      - name: Mom macOS parity
        if: ${{ needs.plan.outputs.mom_present == 'true' && (needs.plan.outputs.mom == 'true' || needs.plan.outputs.full == 'true') }}
        run: |
          node scripts/ci/cargo-group.mjs test product-mom
          cargo test --locked -p mom-llama-runtime --features unstable-w1-vertical-fixtures --all-targets
          cargo test --locked -p mom-llama-app --features unstable-w1-contracts,unstable-w1-vertical-fixtures --all-targets
      - name: Attachment macOS
        if: ${{ needs.plan.outputs.attachment == 'true' || needs.plan.outputs.full == 'true' }}
        run: node scripts/ci/cargo-group.mjs test service-attachment
      - name: Information macOS portable
        if: ${{ needs.plan.outputs.information == 'true' || needs.plan.outputs.full == 'true' }}
        run: node scripts/ci/cargo-group.mjs test service-information
      - name: Speech macOS
        if: ${{ needs.plan.outputs.speech == 'true' || needs.plan.outputs.full == 'true' }}
        run: node scripts/ci/cargo-group.mjs test service-speech
      - name: Loom macOS
        if: ${{ needs.plan.outputs.loom_present == 'true' && (needs.plan.outputs.loom == 'true' || needs.plan.outputs.full == 'true') }}
        run: node scripts/ci/cargo-group.mjs test product-loom research-loom

  dependency-graph:
    if: ${{ needs.plan.outputs.dependency_graph == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - run: cargo metadata --locked --no-deps
      - run: cargo tree -d
      - run: cargo test --locked -p integration-vertical
      - run: cargo tree --locked -i libsqlite3-sys

  import-history:
    if: ${{ needs.plan.outputs.migration_history == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: ./scripts/check-native-import-history.sh
      - run: ./scripts/check-service-import-history.sh
      - run: ./scripts/check-contract-import-history.sh
      - run: ./scripts/check-mom-import-history.sh
      - run: ./scripts/check-loom-import-history.sh

  fuzz-build:
    if: ${{ needs.plan.outputs.fuzz == 'true' || needs.plan.outputs.full == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install nightly-2026-07-26 --profile minimal
      - run: rustup run nightly-2026-07-26 cargo install cargo-fuzz --version 0.13.2 --locked
      - working-directory: crates/services/attachment
        run: |
          rustup run nightly-2026-07-26 cargo fuzz build inspect
          rustup run nightly-2026-07-26 cargo fuzz build pipeline

  ci-required:
    name: ci-required
    if: always()
    needs:
      - plan
      - policy
      - root-linux
      - native-linux
      - gateway-linux
      - attachment-linux
      - information-linux
      - speech-linux
      - mom-linux
      - loom-linux
      - frontend
      - platform-macos
      - dependency-graph
      - import-history
      - fuzz-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - env:
          CI_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-required.mjs
