name: OMP2 maintained runtime

on:
  pull_request:
    paths:
      - "third-party/omp2/**"
      - "xtask/src/omp2.rs"
      - "xtask/src/omp2/**"
      - ".github/workflows/omp2-runtime.yml"
  push:
    branches: [main]
    paths:
      - "third-party/omp2/**"
      - "xtask/src/omp2.rs"
      - "xtask/src/omp2/**"
      - ".github/workflows/omp2-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omp2-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: OMP2 patched inference tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/omp2
      # omp-ai does not link embedded Python; use the system linker instead of
      # the upstream machine-specific lld path. Keep its pinned nightly frontend.
      RUSTFLAGS: "-Z threads=8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - name: Prepare verified source and patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch --branch omp2 https://github.com/can1357/oh-my-pi.git "$RUNNER_TEMP/omp2-source"
          RUSTFLAGS='' CARGO_TARGET_DIR=target/importer cargo run --locked -p xtask -- omp2 prepare "$RUNNER_TEMP/omp2-source" "$RUNNER_TEMP/omp2-tested"
          shasum -a 256 third-party/omp2/patches/* >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-08
          components: rustfmt, clippy, rustc-codegen-cranelift-preview
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab
        with:
          tool: just@1.58.0,cargo-nextest@0.9.143
      - name: Install realtime native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install opus pkgconf ninja
          # audiopus_sys otherwise falls back to an old vendored CMake project.
          test -f "$(brew --prefix opus)/lib/libopus.a"
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig" >> "$GITHUB_ENV"
          pkg-config --modversion opus >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ${{ runner.temp }}/omp2-tested -> ${{ github.workspace }}/target/omp2
          shared-key: omp2-runtime-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Exercise the maintained upstream crate
        working-directory: ${{ runner.temp }}/omp2-tested
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" = nightly-2026-08-08
          just fmt-check-pkg omp-ai
          just test-pkg omp-ai
          just clippy-pkg omp-ai
      - name: Record tested tree
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}/omp2-tested
        shell: bash
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
