name: ci-full

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-full-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  root-macos:
    needs: policy-and-graphs
    if: ${{ needs.policy-and-graphs.outputs.full_required == 'true' }}
    uses: ./.github/workflows/ci-full-root.yml
    with:
      runner: macos-latest

  root:
    if: ${{ !cancelled() && needs.policy-and-graphs.outputs.full_required == 'true' }}
    needs: [macos-required, frontend, policy-and-graphs]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/ci-full-root.yml
    with:
      runner: ${{ matrix.os }}

  frontend:
    needs: policy-and-graphs
    if: ${{ needs.policy-and-graphs.outputs.full_required == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter free-token-energy run check:frontend
      - run: pnpm --filter free-token-energy run test:frontend
      - run: pnpm --filter @delysis/mom-llama run check:frontend
      - run: pnpm --filter @delysis/mom-llama run test:frontend
      - run: pnpm --filter @delysis/loom run test
      - run: pnpm --filter @delysis/loom run check
      - run: pnpm --filter @delysis/loom run build

  policy-and-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      full_required: ${{ steps.plan.outputs.full_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # Filtering test names still builds xtask's Linux GLib regression dependency.
      - name: Install policy test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: policy-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Find the last qualified main revision
        id: baseline
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Missing history or API access means full coverage, never a skip.
          base=$(gh run list --workflow ci-full.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty') || base=''
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select full coverage from the qualified revision
        id: plan
        env:
          CI_FULL_RUN: 'true'
          CI_BASE_SHA: ${{ steps.baseline.outputs.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/ci-plan.mjs
      - run: node --test scripts/ci/test-current-docs.mjs
      - run: node scripts/ci/validate-current-docs.mjs
      - run: node --test scripts/ci/test-ci-metadata-selection.mjs scripts/ci/test-ci-plan.mjs scripts/ci/test-ci-required.mjs scripts/ci/test-ignored-tests.mjs scripts/ci/test-product-state-backup.mjs scripts/ci/test-workflows.mjs
      - run: cargo test --locked -p xtask no_python
      - run: cargo run --locked -p xtask -- policy
      - run: cargo tree --locked -i libsqlite3-sys

  fuzz-build:
    if: ${{ !cancelled() && needs.policy-and-graphs.outputs.full_required == 'true' }}
    needs: [macos-required, frontend, policy-and-graphs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install nightly-2026-07-26 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/services/attachment/fuzz -> target
          shared-key: attachment-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: rustup run nightly-2026-07-26 cargo install cargo-fuzz --version 0.13.2 --locked
      - run: |
          rustup run nightly-2026-07-26 cargo fuzz run --fuzz-dir crates/services/attachment/fuzz inspect -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          rustup run nightly-2026-07-26 cargo fuzz run --fuzz-dir crates/services/attachment/fuzz pipeline -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: failure()
        with:
          name: attachment-fuzz-failures
          path: crates/services/attachment/fuzz/artifacts
          if-no-files-found: ignore

  model-integration:
    if: ${{ !cancelled() && needs.policy-and-graphs.outputs.full_required == 'true' }}
    needs: [macos-required, frontend, policy-and-graphs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: workspace-${{ runner.os }}
          save-if: false
          cache-directories: ${{ runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io/dfbin' || runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io/dfbin' || '' }}
          cache-on-failure: true
      - name: Fetch immutable CPU fixture
        run: >-
          curl --fail --location --retry 3
          https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/60b85c0e3d8fe0f6474f406922a26d12aca4550d/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          --output "$RUNNER_TEMP/model.gguf"
      - name: Execute selected CPU model tests with a verified fixture
        run: >-
          cargo run --locked -p xtask -- model-check "$RUNNER_TEMP/model.gguf"
          9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14
          llama-native-engine tests::real_saved_prefix_restores_live_replays_durable_and_rejects_context_change
          llama-native-engine tests::real_strict_batch_retains_a_pre_cancelled_case_under_exact_model_binding
          mom-llama-runtime real_product_native_chat_cache_reuses_clears_and_disables_without_fte

  macos-required:
    if: always()
    needs: [root-macos, policy-and-graphs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          MACOS_RESULT: ${{ needs.root-macos.result }}
          FULL_REQUIRED: ${{ needs.policy-and-graphs.outputs.full_required }}
          POLICY_RESULT: ${{ needs.policy-and-graphs.result }}
        run: |
          test "$POLICY_RESULT" = success
          case "$FULL_REQUIRED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          if [ "$MACOS_RESULT" != "$expected" ]; then
            echo "macOS full checks: $MACOS_RESULT"
            exit 1
          fi

  full-summary:
    if: always()
    timeout-minutes: 5
    needs:
      - macos-required
      - root-macos
      - root
      - frontend
      - policy-and-graphs
      - fuzz-build
      - model-integration
    runs-on: ubuntu-latest
    steps:
      - env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          FULL_REQUIRED: ${{ needs.policy-and-graphs.outputs.full_required }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.CI_NEEDS_JSON);
            const mode = process.env.FULL_REQUIRED;
            if (!["true", "false"].includes(mode)) process.exit(1);
            const bad = Object.entries(needs).filter(([name, value]) => {
              const expected = mode === "false" && !["policy-and-graphs", "macos-required"].includes(name) ? "skipped" : "success";
              return value.result !== expected;
            });
            if (bad.length > 0) {
              console.error(bad);
              process.exit(1);
            }
          '
