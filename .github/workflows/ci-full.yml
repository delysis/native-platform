name: ci-full

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  root:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - if: runner.os == 'Linux'
        run: node --test scripts/ci/test-current-docs.mjs
      - if: runner.os == 'Linux'
        run: node scripts/ci/validate-current-docs.mjs
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install desktop system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-root-${{ runner.os }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc
      - name: Reconcile ignored-test evidence registry with guarded list arguments
        run: node scripts/ci/validate-ignored-tests.mjs --cargo-list
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Exercise the patched GLib iterator with optimization
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p glib@0.18.5 --lib variant_iter::tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'macOS'
        with:
          node-version: "22"
      - name: Browser interaction and desktop packaging
        if: runner.os == 'macOS'
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @delysis/loom exec playwright install webkit
          pnpm --filter @delysis/loom run test:browser
          pnpm --filter @delysis/loom exec tauri build --debug
          pnpm --filter free-token-energy exec tauri build --debug

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter free-token-energy run check:frontend
      - run: pnpm --filter free-token-energy run test:frontend
      - run: pnpm --filter @delysis/mom-llama run check:frontend
      - run: pnpm --filter @delysis/mom-llama run test:frontend
      - run: pnpm --filter @delysis/loom run test
      - run: pnpm --filter @delysis/loom run check
      - run: pnpm --filter @delysis/loom run build

  policy-and-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - run: node --test scripts/ci/test-ci-metadata-shadow.mjs scripts/ci/test-ci-plan.mjs scripts/ci/test-ci-required.mjs scripts/ci/test-ignored-tests.mjs scripts/ci/test-product-state-backup.mjs scripts/ci/test-workflows.mjs
      - run: cargo run --locked -p xtask -- policy
      - run: cargo tree --locked -i libsqlite3-sys

  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install nightly-2026-07-26 --profile minimal
      - run: rustup run nightly-2026-07-26 cargo install cargo-fuzz --version 0.13.2 --locked
      - run: |
          rustup run nightly-2026-07-26 cargo fuzz run --fuzz-dir crates/services/attachment/fuzz inspect -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          rustup run nightly-2026-07-26 cargo fuzz run --fuzz-dir crates/services/attachment/fuzz pipeline -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: failure()
        with:
          name: attachment-fuzz-failures
          path: crates/services/attachment/fuzz/artifacts
          if-no-files-found: ignore

  model-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cpu-model-integration
      - name: Fetch immutable CPU fixture
        run: >-
          curl --fail --location --retry 3
          https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/60b85c0e3d8fe0f6474f406922a26d12aca4550d/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          --output "$RUNNER_TEMP/model.gguf"
      - name: Execute selected CPU model tests with a verified fixture
        run: >-
          cargo run --locked -p xtask -- model-check "$RUNNER_TEMP/model.gguf"
          9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14
          llama-native-engine tests::real_saved_prefix_restores_live_replays_durable_and_rejects_context_change
          llama-native-engine tests::real_strict_batch_retains_a_pre_cancelled_case_under_exact_model_binding

  full-summary:
    if: always()
    needs:
      - root
      - frontend
      - policy-and-graphs
      - fuzz-build
      - model-integration
    runs-on: ubuntu-latest
    steps:
      - env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.CI_NEEDS_JSON);
            const bad = Object.entries(needs).filter(([, value]) => value.result !== "success");
            if (bad.length > 0) {
              console.error(bad);
              process.exit(1);
            }
          '
