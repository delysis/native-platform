name: ci-full

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      mom: ${{ steps.inventory.outputs.mom }}
      loom: ${{ steps.inventory.outputs.loom }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: inventory
        shell: bash
        run: |
          if test -f products/mom/Cargo.toml || test -f products/mom/crates/mom-llama-runtime/Cargo.toml; then
            echo "mom=true" >> "$GITHUB_OUTPUT"
          else
            echo "mom=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f products/loom/apps/loom/src-tauri/Cargo.toml; then
            echo "loom=true" >> "$GITHUB_OUTPUT"
          else
            echo "loom=false" >> "$GITHUB_OUTPUT"
          fi

  root:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install desktop system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-root-${{ runner.os }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  attachment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-attachment-${{ runner.os }}
      - run: node scripts/ci/cargo-group.mjs fmt service-attachment
      - run: node scripts/ci/cargo-group.mjs test service-attachment
      - if: runner.os == 'Linux'
        run: node scripts/ci/cargo-group.mjs clippy service-attachment

  information-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-information-${{ runner.os }}
      - run: node scripts/ci/cargo-group.mjs test service-information
      - if: runner.os == 'Linux'
        run: node scripts/ci/cargo-group.mjs clippy service-information

  information-platform-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy

  speech:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install desktop system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-speech-${{ runner.os }}
      - run: node scripts/ci/cargo-group.mjs fmt service-speech
      - run: node scripts/ci/cargo-group.mjs test service-speech
      - if: runner.os == 'Linux'
        run: node scripts/ci/cargo-group.mjs clippy service-speech

  mom:
    if: ${{ needs.inventory.outputs.mom == 'true' }}
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install desktop system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-mom-${{ runner.os }}
      - run: node scripts/ci/cargo-group.mjs test product-mom
      - if: runner.os == 'Linux'
        run: node scripts/ci/cargo-group.mjs clippy product-mom

  loom:
    if: ${{ needs.inventory.outputs.loom == 'true' }}
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install desktop system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: full-loom-${{ runner.os }}
      - run: node scripts/ci/cargo-group.mjs fmt product-loom
      - run: node scripts/ci/cargo-group.mjs test product-loom
      - if: runner.os == 'Linux'
        run: node scripts/ci/cargo-group.mjs clippy product-loom

  frontend:
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev libglib2.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run check
      - run: pnpm -r --if-present run build

  policy-and-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
      - run: node --test scripts/ci/test-ci-plan.mjs scripts/ci/test-ci-required.mjs scripts/ci/test-workflows.mjs
      - run: cargo run --locked -p xtask -- policy
      - run: cargo tree --locked -i libsqlite3-sys

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install nightly-2026-07-26 --profile minimal
      - run: rustup run nightly-2026-07-26 cargo install cargo-fuzz --version 0.13.2 --locked
      - run: |
          rustup run nightly-2026-07-26 cargo fuzz build --fuzz-dir crates/services/attachment/fuzz inspect
          rustup run nightly-2026-07-26 cargo fuzz build --fuzz-dir crates/services/attachment/fuzz pipeline

  full-summary:
    if: always()
    needs:
      - inventory
      - root
      - attachment
      - information-portable
      - information-platform-linux
      - speech
      - mom
      - loom
      - frontend
      - policy-and-graphs
      - fuzz-build
    runs-on: ubuntu-latest
    steps:
      - env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.CI_NEEDS_JSON);
            const bad = Object.entries(needs).filter(([, value]) =>
              !["success", "skipped"].includes(value.result)
            );
            if (bad.length > 0) {
              console.error(bad);
              process.exit(1);
            }
          '
