name: Loom Signal worker
description: Build and check the separately pinned Rust Signal client before compiling Loom
runs:
  using: composite
  steps:
    - shell: bash
      run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
    - shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes protobuf-compiler libssl-dev pkg-config
    - shell: bash
      if: runner.os == 'macOS'
      run: brew list protobuf >/dev/null 2>&1 || brew install protobuf
    - shell: pwsh
      if: runner.os == 'Windows'
      run: choco install protoc --no-progress --yes
    - shell: bash
      run: |
        cargo +1.94.0 fmt --manifest-path products/loom/signal/Cargo.toml -- --check
        cargo +1.94.0 test --locked --manifest-path products/loom/signal/Cargo.toml
        cargo +1.94.0 clippy --locked --manifest-path products/loom/signal/Cargo.toml --all-targets -- -D warnings
        node scripts/build-loom-signal.mjs
