[package]
name = "platform-contracts-v0"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
jsonschema = { version = "=0.49.9", default-features = false }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
