[workspace]
members = [
    "crates/platform-contracts-v0",
    "crates/platform-contract-testkit",
    "crates/platform-vertical-fixtures-v0",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
platform-contracts-v0 = { path = "crates/platform-contracts-v0" }
platform-vertical-fixtures-v0 = { path = "crates/platform-vertical-fixtures-v0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
