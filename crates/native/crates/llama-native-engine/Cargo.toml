[package]
name = "llama-native-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
llama-native-types = { path = "../llama-native-types" }
crossbeam-channel.workspace = true
encoding_rs = "0.8"
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["sampler", "mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.153", default-features = false }
sha2.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["sampler", "mtmd", "metal"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
