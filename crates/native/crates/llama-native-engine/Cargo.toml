[package]
name = "llama-native-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Owner-thread in-process llama.cpp engine with typed streaming and cancellation"

[features]
default = []
unstable-w1-contract-tests = ["dep:platform-contract-testkit"]
unstable-w1-vertical-tests = [
    "dep:platform-contracts-v0-vertical",
    "dep:platform-vertical-fixtures-v0",
]

[dependencies]
llama-native-types = { path = "../llama-native-types" }
crossbeam-channel.workspace = true
encoding_rs = "0.8"
fs4 = "1.1.0"
llama-cpp-2 = { version = "=0.1.154", git = "https://github.com/delysis/llama-cpp-rs.git", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false, features = ["common", "sampler", "mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.154", git = "https://github.com/delysis/llama-cpp-rs.git", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false }
sha2.workspace = true
platform-contract-testkit = { git = "https://github.com/delysis/w1-platform-contracts.git", rev = "cbab33555ab9355a6ac453d659c55ec9e0666821", optional = true }
platform-contracts-v0-vertical = { package = "platform-contracts-v0", git = "https://github.com/delysis/w1-platform-contracts.git", rev = "fc24ffff08c52690390b4460f44617d5d9732563", optional = true }
platform-vertical-fixtures-v0 = { git = "https://github.com/delysis/w1-platform-contracts.git", rev = "fc24ffff08c52690390b4460f44617d5d9732563", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "=0.1.154", git = "https://github.com/delysis/llama-cpp-rs.git", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false, features = ["common", "sampler", "mtmd", "metal"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
sha2.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
