[package]
name = "llama-native-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Owner-thread in-process llama.cpp engine with typed streaming and cancellation"

[dependencies]
llama-native-types = { path = "../llama-native-types" }
crossbeam-channel.workspace = true
encoding_rs = "0.8"
fs4 = "1.1.0"
llama-cpp-2 = { version = "=0.1.154", git = "https://github.com/delysis/llama-cpp-rs.git", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false, features = ["common", "sampler", "mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.154", git = "https://github.com/delysis/llama-cpp-rs.git", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false }
sha2.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "=0.1.154", git = "https://github.com/delysis/llama-cpp-rs.git", rev = "a3cf95eb1d4fa748480eb780e6fcbfc1a5c1c391", default-features = false, features = ["common", "sampler", "mtmd", "metal"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
sha2.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
