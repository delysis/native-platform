[workspace]
resolver = "2"
members = [
    "crates/command-evidence",
    "crates/llama-native-types",
    "crates/llama-native-engine",
    "crates/llama-native-cache",
    "crates/llama-native-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/delysis/llama-native-kit"
rust-version = "1.85"

[workspace.dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev.package.sha2]
opt-level = 3
