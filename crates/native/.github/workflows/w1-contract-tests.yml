name: W1 contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-lifecycle-contract:
    name: Native lifecycle contract (Rust 1.92)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build ripgrep

      - name: Check immutable contract architecture
        run: ./scripts/check-architecture.sh

      - name: Test complete native lifecycle manifest
        run: cargo test --locked -p llama-native-engine --features unstable-w1-contract-tests operation_registry::w1_contract_adapter

      - name: Lint native lifecycle implementation
        run: cargo clippy --locked -p llama-native-engine --features unstable-w1-contract-tests --all-targets -- -D warnings
