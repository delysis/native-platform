name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: ./scripts/check-workflow-policy.sh
      - run: ./tests/workflow_policy.sh

  native-runtime:
    name: Native runtime (${{ matrix.os }})
    needs: workflow-policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build ripgrep

      - name: Install architecture-check tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Test default workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint default workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check architecture
        if: runner.os != 'Windows'
        run: ./scripts/check-architecture.sh
