name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: ./scripts/check-workflow-policy.sh
      - run: ./tests/workflow_policy.sh
      - run: ./scripts/check-boundaries.sh

  msrv:
    name: MSRV 1.88
    needs: workflow-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - run: cargo check --locked --workspace --all-targets

  audit:
    name: Dependency audit
    needs: workflow-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  rust:
    name: Rust 1.88 (${{ matrix.os }})
    needs: workflow-policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: runner.os != 'Windows'
        run: ./scripts/check-boundaries.sh

  fuzz-build:
    name: Fuzz targets build
    needs: workflow-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-07-26
          components: rustfmt
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo fuzz build inspect
      - run: cargo fuzz build pipeline

  bounded-fuzz:
    name: Scheduled bounded fuzz
    if: github.event_name == 'schedule'
    needs: fuzz-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-07-26
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run inspect -- -max_total_time=60 -timeout=5
      - run: cargo fuzz run pipeline -- -max_total_time=60 -timeout=5
