[package]
name = "attachment-native-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
attachment-native-host = { path = "../crates/attachment-native-host" }
attachment-native-inspect = { path = "../crates/attachment-native-inspect" }
attachment-native-types = { path = "../crates/attachment-native-types" }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "inspect"
path = "fuzz_targets/inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false
