[package]
name = "easl"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
lazy_static = "1.5.0"
fsexp = { path = "../fsexp" }
take_mut = "0.2.2"
thiserror = "2.0.11"
unicode-segmentation = "1.12.0"
unicode-bidi = "=0.3.18"
icu_segmenter = "=2.2.0"
icu_properties = "=2.2.0"
wgpu = { version = "29.0.3", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
cpal = { version = "0.15", optional = true }
libloading = { version = "0.8", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hound = "3.5"
arc-swap = "1.7"
swash = "0.2.10"
harfrust = "=0.12.0"
read-fonts = "=0.41.0"

[features]
window = ["dep:wgpu", "dep:winit", "dep:pollster", "dep:cpal"]
# `c_audio` swaps the audio thread's per-sample function from the bytecode VM
# (the default, portable, no-external-deps path) to a JIT-compiled C dylib
# loaded via `libloading`. Faster but requires `clang` on the host.
c_audio = ["window", "dep:libloading"]

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }
