[package]
name = "easl-native-text"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
parley = { version = "=0.11.1", features = ["complex-scripts", "accesskit"] }
vello_cpu = { version = "=0.2.0", features = ["f32_pipeline"] }
accesskit = "=0.24.1"
serde.workspace = true
thiserror.workspace = true
unicode-segmentation = "1.12"
roxmltree = "0.21.1"

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
[lints.clippy]
all = { level = "warn", priority = -1 }
