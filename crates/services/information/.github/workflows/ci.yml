name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: ./scripts/check-workflow-policy.sh
      - run: ./tests/workflow_policy.sh
      - run: ./scripts/check-portable-packages.sh

  portable:
    name: Portable core (${{ matrix.os }})
    needs: workflow-policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy
      - name: Install boundary-check tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Test portable packages
        shell: bash
        run: ./scripts/run-portable-cargo.sh test
      - name: Test Wave 1 publication adapter
        shell: bash
        run: cargo test --locked -p information-native-acquire --features unstable-w1-contracts
      - name: Lint portable packages
        shell: bash
        run: ./scripts/run-portable-cargo.sh clippy
      - name: Check authority boundaries
        if: runner.os == 'Linux'
        run: ./scripts/check-boundaries.sh

  tauri-linux:
    name: Tauri plugin (Linux)
    needs: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.92.0"
          components: clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libappindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config
      - run: cargo test --locked -p tauri-plugin-information-native --all-targets
      - run: cargo clippy --locked -p tauri-plugin-information-native --all-targets --all-features -- -D warnings
