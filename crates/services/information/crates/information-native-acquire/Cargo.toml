[package]
name = "information-native-acquire"
version = "0.1.0"
edition.workspace = true
description = "Local-first offline information resource components for native AI applications"
license.workspace = true
readme = "../../README.md"
rust-version.workspace = true

[features]
unstable-w1-contracts = ["dep:platform-contracts-v0"]

[dependencies]
fs2.workspace = true
hex.workspace = true
information-native-types.workspace = true
reqwest.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["net", "rt", "time"] }
url.workspace = true
platform-contracts-v0 = { workspace = true, optional = true }

[dev-dependencies]
platform-contracts-v0.workspace = true

[lints]
workspace = true
