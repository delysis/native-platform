[package]
name = "information-native-host"
version = "0.1.0"
edition.workspace = true
description = "Local-first offline information resource components for native AI applications"
license.workspace = true
readme = "../../README.md"
rust-version.workspace = true

[features]
default = []
# Test-only adapter for immutable Wave 1 vertical fixtures.
unstable-w1-vertical-tests = ["dep:platform-contracts-fixture-v0", "dep:platform-vertical-fixtures-v0"]

[dependencies]
chrono.workspace = true
hex.workspace = true
information-native-acquire.workspace = true
information-native-backend-community.workspace = true
information-native-backend-encyclopedia.workspace = true
information-native-backend-scripture.workspace = true
information-native-backend-sqlite.workspace = true
information-native-catalog.workspace = true
information-native-retrieval.workspace = true
information-native-store.workspace = true
information-native-types.workspace = true
platform-vertical-fixtures-v0 = { workspace = true, optional = true }
platform-contracts-fixture-v0 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[lints]
workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
